name: Agent live behavior evals

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model for the agent and semantic judge
        required: true
        default: gpt-5
        type: string
      semantic_judge:
        description: Run the optional LLM semantic rubric after trace evaluation
        required: true
        default: true
        type: boolean

jobs:
  live-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install agent dependencies
        working-directory: agent
        run: pip install -r requirements.txt

      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Repository secret OPENAI_API_KEY is required for live behavior evaluation."
            exit 1
          fi

      - name: Start MySQL
        run: docker compose up -d db

      - name: Wait for MySQL initialization
        run: |
          for attempt in {1..60}; do
            if docker compose exec -T db sh -c 'mysql -h127.0.0.1 -P3306 -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1"' >/dev/null 2>&1; then
              echo "MySQL initialization is complete."
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time."
          docker compose logs db
          exit 1

      - name: Load base O2C dataset
        run: docker compose exec -T db sh -c 'mysql -h127.0.0.1 -P3306 -uroot -p"$MYSQL_ROOT_PASSWORD"' < sql/complete_setup.sql

      - name: Apply Scenario V1
        run: docker compose exec -T db sh -c 'mysql -h127.0.0.1 -P3306 -uroot -p"$MYSQL_ROOT_PASSWORD"' < agent/data/scenario_v1_marketplace_bottleneck.sql

      - name: Reconfirm Scenario V1 calibration
        working-directory: agent
        env:
          DATABASE_URL: mysql+pymysql://app:app_pw@localhost:3306/o2c
          PYTHONPATH: .
        run: python scripts/calibrate_scenario_v1.py | tee ../scenario-v1-live-calibration.json

      - name: Run live agent eval suite
        id: live
        continue-on-error: true
        working-directory: agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model }}
          DATABASE_URL: mysql+pymysql://app:app_pw@localhost:3306/o2c
          POLICY_PATH: policies
          STATE_DB_PATH: artifacts/live-eval-state.db
          PYTHONPATH: .
        run: python scripts/run_live_evals.py --output artifacts/live_eval_report.json

      - name: Run semantic rubric judge
        id: semantic
        if: ${{ inputs.semantic_judge && hashFiles('agent/artifacts/live_eval_report.json') != '' }}
        continue-on-error: true
        working-directory: agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model }}
          PYTHONPATH: .
        run: python scripts/run_semantic_judge.py --input artifacts/live_eval_report.json --output artifacts/semantic_eval_report.json

      - name: Build portfolio evaluation summary
        id: summary
        if: ${{ hashFiles('agent/artifacts/live_eval_report.json') != '' }}
        continue-on-error: true
        working-directory: agent
        run: |
          python scripts/build_eval_summary.py \
            --live artifacts/live_eval_report.json \
            --semantic artifacts/semantic_eval_report.json \
            --output artifacts/evaluation_summary.md

      - name: Upload live evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-live-eval-${{ github.run_number }}
          path: |
            agent/artifacts/live_eval_report.json
            agent/artifacts/semantic_eval_report.json
            agent/artifacts/evaluation_summary.md
            scenario-v1-live-calibration.json
          if-no-files-found: warn

      - name: Enforce evaluation result
        if: always()
        shell: bash
        run: |
          failed=0
          if [ "${{ steps.live.outcome }}" != "success" ]; then
            echo "Live deterministic trace evaluation failed."
            failed=1
          fi
          if [ "${{ inputs.semantic_judge }}" = "true" ] && [ "${{ steps.semantic.outcome }}" != "success" ]; then
            echo "Semantic rubric evaluation failed or did not complete."
            failed=1
          fi
          if [ "${{ steps.summary.outcome }}" != "success" ]; then
            echo "Evaluation summary generation failed."
            failed=1
          fi
          exit "$failed"

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs db

      - name: Shut down database
        if: always()
        run: docker compose down -v
