name: Agent mocked behavior evals

on:
  push:
    paths:
      - "agent/**"
      - "sql/**"
      - "docker-compose.yml"
      - ".github/workflows/agent-mocked-evals.yml"
  pull_request:
    paths:
      - "agent/**"
      - "sql/**"
      - "docker-compose.yml"
      - ".github/workflows/agent-mocked-evals.yml"

jobs:
  mocked-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install agent dependencies
        working-directory: agent
        run: pip install -r requirements.txt

      - name: Start MySQL
        run: docker compose up -d db

      - name: Wait for MySQL initialization
        run: |
          for attempt in {1..60}; do
            if docker compose exec -T db sh -c 'mysql -h127.0.0.1 -P3306 -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1"' >/dev/null 2>&1; then
              echo "MySQL initialization is complete."
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time."
          docker compose logs db
          exit 1

      - name: Load base O2C dataset
        run: docker compose exec -T db sh -c 'mysql -h127.0.0.1 -P3306 -uroot -p"$MYSQL_ROOT_PASSWORD"' < sql/complete_setup.sql

      - name: Apply Scenario V1
        run: docker compose exec -T db sh -c 'mysql -h127.0.0.1 -P3306 -uroot -p"$MYSQL_ROOT_PASSWORD"' < agent/data/scenario_v1_marketplace_bottleneck.sql

      - name: Reconfirm Scenario V1 calibration
        working-directory: agent
        env:
          DATABASE_URL: mysql+pymysql://app:app_pw@localhost:3306/o2c
          PYTHONPATH: .
        run: python scripts/calibrate_scenario_v1.py | tee ../scenario-v1-mock-calibration.json

      - name: Start mock demo API
        env:
          MODEL_BACKEND: mock
        run: docker compose up -d --build agent

      - name: Wait for mock demo API
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/health > /tmp/demo-health.json; then
              python - <<'PY'
import json
payload = json.load(open("/tmp/demo-health.json"))
assert payload["status"] == "ok"
assert payload["model_backend"] == "mock"
print(payload)
PY
              exit 0
            fi
            sleep 2
          done
          docker compose logs agent
          exit 1

      - name: Verify full portfolio demo through FastAPI
        run: |
          mkdir -p agent/artifacts
          curl --fail --silent \
            -X POST http://localhost:8000/agent/ask \
            -H "Content-Type: application/json" \
            -d '{"question":"Investigate why O2C cycle time worsened in Q3 2024 versus Q2 2024. Identify the stage that deteriorated most, drill into the strongest driver, and test a realistic improvement scenario."}' \
            > agent/artifacts/demo_api_response.json
          python - <<'PY'
import json
path = "agent/artifacts/demo_api_response.json"
payload = json.load(open(path))
assert payload["backend"] == "mock", payload
assert payload["tool_call_count"] == 4, payload["tool_trace"]
assert [item["tool"] for item in payload["tool_trace"]] == [
    "compare_stage_performance",
    "analyze_process",
    "retrieve_policy",
    "simulate_stage_improvement",
]
answer = payload["answer"]
for expected in ["FINDING", "Marketplace", "WHAT-IF SCENARIO", "NEXT ACTION", "DEMO NOTE"]:
    assert expected in answer, (expected, answer)
print("Full portfolio demo API path passed.")
PY

      - name: Run free mocked agent eval suite
        working-directory: agent
        env:
          MODEL_BACKEND: mock
          DATABASE_URL: mysql+pymysql://app:app_pw@localhost:3306/o2c
          POLICY_PATH: policies
          STATE_DB_PATH: artifacts/mock-eval-state.db
          PYTHONPATH: .
        run: python scripts/run_live_evals.py --backend mock --output artifacts/mock_eval_report.json

      - name: Build mocked evaluation summary
        working-directory: agent
        run: |
          python scripts/build_eval_summary.py \
            --live artifacts/mock_eval_report.json \
            --semantic artifacts/no_semantic_report.json \
            --output artifacts/mock_evaluation_summary.md

      - name: Upload mocked evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-mock-eval-${{ github.run_number }}
          path: |
            agent/artifacts/mock_eval_report.json
            agent/artifacts/mock_evaluation_summary.md
            agent/artifacts/demo_api_response.json
            scenario-v1-mock-calibration.json
          if-no-files-found: error

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs db

      - name: Shut down database
        if: always()
        run: docker compose down -v
