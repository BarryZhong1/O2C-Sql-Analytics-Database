name: Agent unit tests

on:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent-unit-tests.yml"
  push:
    branches:
      - main
      - feature/process-improvement-agent
    paths:
      - "agent/**"
      - ".github/workflows/agent-unit-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agent

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall app scripts tests

      - name: Run unit tests
        run: python -m pytest -q
