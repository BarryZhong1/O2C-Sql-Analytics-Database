name: Codespaces / devcontainer smoke test

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - "agent/**"
      - "sql/**"
      - "docker-compose.yml"
      - ".github/workflows/codespaces-smoke.yml"
  push:
    branches:
      - main
    paths:
      - ".devcontainer/**"
      - "agent/**"
      - "sql/**"
      - "docker-compose.yml"
      - ".github/workflows/codespaces-smoke.yml"
  workflow_dispatch:

jobs:
  codespaces-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      - name: Validate Codespaces workspace configuration
        run: |
          python - <<'PY'
          import json
          p = json.load(open(".devcontainer/devcontainer.json"))
          assert p["workspaceFolder"] == "/workspaces/O2C-Sql-Analytics-Database", p
          raw = open(".devcontainer/devcontainer.json").read()
          assert "${localWorkspaceFolder}" not in raw, raw
          assert "workspaceMount" not in p, p
          print("Codespaces workspace configuration is safe for browser VS Code.")
          PY

      - name: Build and start devcontainer
        run: |
          devcontainer up \
            --workspace-folder . \
            --log-level info \
            | tee /tmp/devcontainer-up.json

      - name: Verify Docker inside devcontainer
        run: |
          devcontainer exec --workspace-folder . bash -lc '
            docker info >/dev/null
            docker compose version
            docker compose ps
          '

      - name: Verify full demo readiness inside devcontainer
        run: |
          devcontainer exec --workspace-folder . bash -lc '
            docker compose exec -T agent python -c "import urllib.request; print(urllib.request.urlopen('"'"'http://127.0.0.1:8000/demo/status'"'"', timeout=5).read().decode())" > /tmp/status.json
            python3 -c "import json; p=json.load(open('"'"'/tmp/status.json'"'"')); assert p['"'"'ready'"'"'] is True, p; assert p['"'"'model_backend'"'"']=='"'"'mock'"'"', p; assert p['"'"'app_version'"'"']=='"'"'0.5.0'"'"', p; assert p['"'"'database'"'"']['"'"'order_count'"'"']>0, p; assert p['"'"'scenario'"'"']['"'"'applied'"'"'] is True, p; print(p)"
          '

      - name: Verify main agent investigation inside devcontainer
        run: |
          devcontainer exec --workspace-folder . bash -lc '
            docker compose exec -T agent python scripts/run_demo_cli.py --url http://127.0.0.1:8000 --output /tmp/codespaces-response.json > /tmp/codespaces-cli.txt
            docker compose exec -T agent python scripts/verify_demo_response.py /tmp/codespaces-response.json
            grep -q "Marketplace" /tmp/codespaces-cli.txt
          '

      - name: Show devcontainer logs on failure
        if: failure()
        run: |
          devcontainer exec --workspace-folder . bash -lc 'docker compose logs db agent' || true

      - name: Stop nested demo services
        if: always()
        run: |
          devcontainer exec --workspace-folder . bash -lc 'docker compose down -v --remove-orphans' || true
