name: Codespaces / devcontainer smoke test

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - "agent/**"
      - "sql/**"
      - "docker-compose.yml"
      - ".github/workflows/codespaces-smoke.yml"
  push:
    branches:
      - main
    paths:
      - ".devcontainer/**"
      - "agent/**"
      - "sql/**"
      - "docker-compose.yml"
      - ".github/workflows/codespaces-smoke.yml"
  workflow_dispatch:

jobs:
  codespaces-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      - name: Validate Codespaces workspace configuration
        run: |
          python - <<'PY'
          import json
          p = json.load(open(".devcontainer/devcontainer.json"))
          raw = open(".devcontainer/devcontainer.json").read()
          assert "${localWorkspaceFolder}" not in raw, raw
          assert "workspaceMount" not in p, p
          assert "workspaceFolder" not in p, p
          assert not p.get("postCreateCommand"), p
          assert p["postStartCommand"] == "bash .devcontainer/start-background.sh", p
          assert "postStartCommand" in p, p
          print("Codespaces will use its native repository workspace mount.")
          PY

      - name: Build and start devcontainer
        run: |
          devcontainer up \
            --workspace-folder . \
            --log-level info \
            | tee /tmp/devcontainer-up.json

      - name: Verify workspace and Docker inside devcontainer
        run: |
          devcontainer exec --workspace-folder . bash -lc '
            case "$PWD" in
              */O2C-Sql-Analytics-Database) ;;
              *) echo "Unexpected workspace: $PWD"; exit 1 ;;
            esac
            test -f README.md
            test -f agent/app/main.py
            docker info >/dev/null
            docker compose version
            docker compose ps
          '

      - name: Wait for async demo initialization and verify readiness
        run: |
          devcontainer exec --workspace-folder . bash -lc 'bash .devcontainer/wait-for-demo.sh 600'

      - name: Verify main agent investigation inside devcontainer
        run: |
          devcontainer exec --workspace-folder . bash -lc '
            docker compose exec -T agent python scripts/run_demo_cli.py --url http://127.0.0.1:8000 --output /tmp/codespaces-response.json > /tmp/codespaces-cli.txt
            docker compose exec -T agent python scripts/verify_demo_response.py /tmp/codespaces-response.json
            grep -q "Marketplace" /tmp/codespaces-cli.txt
          '

      - name: Show devcontainer logs on failure
        if: failure()
        run: |
          devcontainer exec --workspace-folder . bash -lc 'tail -n 120 "$HOME/.local/state/o2c-demo/bootstrap.log"' || true
          devcontainer exec --workspace-folder . bash -lc 'docker compose logs db agent' || true

      - name: Stop nested demo services
        if: always()
        run: |
          devcontainer exec --workspace-folder . bash -lc 'docker compose down -v --remove-orphans' || true
