services:
  db:
    image: mysql:8.4
    command: ["--default-time-zone=+00:00", "--log_bin_trust_function_creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: o2c
      MYSQL_USER: app
      MYSQL_PASSWORD: app_pw
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - db
volumes:
  dbdata:
